name: Ginesys Billing Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas openpyxl
          playwright install --with-deps chromium

      - name: Run Ginesys Bot Script
        run: python bot.py

      - name: Commit Fresh Report to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add billing_data.xlsx || true
          git commit -m "Auto updated fresh Ginesys Delivery Challan Pending Excel Data" || exit 0
          git push
